name: Tests

on:
  push:
    branches: [main, 'candidate/WO-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.5']
    steps:
      - name: App auschecken
        uses: actions/checkout@v7
        with:
          path: app
      - name: Test-Harness (Parent) auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/br-nextcloud-apps
          ref: main
          path: '.'
          clean: false
      - name: Organisationsprovider für Vertragstests auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-flz-organization
          ref: bcd5b03fab962feef08720d13ee340b043855488
          path: flz_organization
      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: ${{ matrix.php-version == '8.3' && 'xdebug' || 'none' }}
          tools: none
      - name: PHP-Tests
        if: matrix.php-version == '8.5'
        working-directory: app
        run: php tests/run.php
      - name: PHP-Coverage-Tooling installieren
        if: matrix.php-version == '8.3'
        run: composer install --working-dir=test-harness/coverage --no-interaction --no-progress --prefer-dist
      - name: PHP-Coverage
        if: matrix.php-version == '8.3'
        working-directory: app
        run: |
          mkdir -p "$RUNNER_TEMP/php-coverage"
          PHP_COVERAGE_COMMAND="$GITHUB_WORKSPACE/test-harness/coverage/vendor/bin/phpcov" \
          PHP_COVERAGE_OUTPUT_DIR="$RUNNER_TEMP/php-coverage" \
          php tests/run.php
          php "$GITHUB_WORKSPACE/test-harness/coverage/merge-clover.php" flzplaner "$RUNNER_TEMP/php-coverage" 44.47

  javascript:
    name: JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: App auschecken
        uses: actions/checkout@v7
        with:
          path: app
      - name: Test-Harness (Parent) auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/br-nextcloud-apps
          ref: main
          path: '.'
          clean: false
      - name: Organisationsprovider für Vertragstests auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-flz-organization
          ref: bcd5b03fab962feef08720d13ee340b043855488
          path: flz_organization
      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: JavaScript-Coverage-Tooling installieren
        run: npm ci --prefix test-harness/coverage --ignore-scripts
      - name: JavaScript-Tests mit Coverage
        working-directory: app
        run: |
          ../test-harness/coverage/node_modules/.bin/c8 \
            --all \
            '--include=js/**/*.js' \
            --check-coverage \
            --lines=86.47 \
            node tests/run-js.mjs
